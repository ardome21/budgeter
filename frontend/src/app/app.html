<header>
  <div class="wrap">
    <span class="brand">budgeter</span>
    @if (auth.signedIn()) {
      <nav>
        <a routerLink="/month" routerLinkActive="active">Month</a>
        <a routerLink="/transactions" routerLinkActive="active">Transactions</a>
        <a routerLink="/linked" routerLinkActive="active">Linked</a>
        <a routerLink="/import" routerLinkActive="active">Import</a>
        <a routerLink="/accounts" routerLinkActive="active">Accounts</a>
        <a routerLink="/investments" routerLinkActive="active">Investments</a>
        <a routerLink="/settings" routerLinkActive="active">Settings</a>
      </nav>
      <button type="button" class="signout" (click)="auth.logout()">
        Sign out
        <span class="who">{{ auth.username() }}</span>
      </button>
    }
  </div>
</header>

<main class="wrap">
  <router-outlet />
</main>
