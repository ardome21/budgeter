[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ardome21", email = "ardome21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.0",
    "fastapi>=0.141.1",
    # Fetching market prices. Was already here as a dev dependency, because
    # TestClient needs it; a runtime import must not rely on that.
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "plaid-python>=39.0.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
    "webauthn>=2.5.2",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
# scripts/ holds the one-shot importer; its pure helpers are worth testing.
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Depends()/File()/Form() in argument defaults is the FastAPI idiom, not a
# mutable default argument.
"src/backend/main.py" = ["B008"]
"src/backend/routers/*" = ["B008"]
# Money is dated by local calendar day, not by instant. A purchase on the 31st
# belongs to that month wherever the server happens to be, so naive dates are
# the correct type here rather than an oversight.
"src/backend/csv_import.py" = ["DTZ007"]
# Same reasoning for a statement: 'Date downloaded Aug-08-2026' names a day,
# and the positions were true on that day in every timezone.
"src/backend/fidelity_import.py" = ["DTZ007"]
# A closing price belongs to a trading day, not to an instant. The exchange
# date is what the cache is keyed on and what a proxy ratio compares, so a
# calendar date is the correct type rather than a missing timezone.
"src/backend/prices.py" = ["DTZ011"]
"src/backend/queries.py" = ["DTZ011"]
"src/backend/routers/config.py" = ["B008", "DTZ011"]
# openpyxl hands back naive datetimes; the fixtures mirror that faithfully.
"tests/*" = ["DTZ001", "DTZ011"]
