[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ardome21", email = "ardome21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
# scripts/ holds the one-shot importer; its pure helpers are worth testing.
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Depends() in an argument default is the FastAPI idiom, not a mutable default.
"src/backend/main.py" = ["B008"]
# openpyxl hands back naive datetimes; the fixtures mirror that faithfully.
"tests/*" = ["DTZ001"]
