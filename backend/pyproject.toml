[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ardome21", email = "ardome21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.0",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "plaid-python>=39.0.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
    "webauthn>=2.5.2",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # TestClient's transport. A dev dependency again: it was promoted to a
    # runtime one for the price fetcher, and the price fetcher is gone.
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.ruff.lint]
# Ruff's default is E4/E7/E9 and F — barely more than syntax. Everything below
# was already being written for: the tree is full of `# noqa: B008`,
# `# noqa: DTZ011`, `# noqa: BLE001, S110`, each one suppressing a rule that
# was never switched on, which means each one was decoration and the check it
# claimed to have considered never ran. RUF100 now fails on an inert noqa, so
# that cannot drift apart again.
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "UP",           # pyupgrade — this is a 3.12-only codebase
    "B",            # bugbear
    "BLE",          # blind except
    "DTZ",          # naive datetimes, which money dated by calendar day needs
    "S",            # bandit
    "C4",           # comprehensions
    "SIM",          # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Depends()/Query() in argument defaults is the FastAPI idiom, not a mutable
# default argument.
"src/backend/main.py" = ["B008"]
"src/backend/routers/*" = ["B008"]
# Money is dated by local calendar day, not by instant. A balance snapshot
# means "what this was worth today" where the person refreshing is, and a
# purchase on the 31st belongs to that month wherever the server happens to
# be — so a naive date is the correct type here rather than an oversight.
"src/backend/queries.py" = ["DTZ011"]
# Tests assert, and they talk to the development database with credentials
# from .env. Bandit's assert and hardcoded-password rules are noise here.
# The naive dates are the same calendar-day reasoning as above.
"tests/*" = ["S101", "S105", "S106", "DTZ001", "DTZ011"]
# Autogenerated by alembic and then read, not restyled.
"alembic/versions/*" = ["E501"]
